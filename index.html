<script>
(function(){
var BACKEND_URL = 'https://kasi-ai-backend.onrender.com';
var $=function(s){return document.querySelector(s)};
function ld(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var S=ld('kasi',{pts:0,streak:0,last:'',badges:[],lang:'en',exam:''});
var LANGS={en:['English','Sharp, fam! Ready to cook?','en-ZA'],zu:['isiZulu','Sawubona! Sharp, ready to cook?','zu-ZA'],xh:['isiXhosa','Molo! Sharp, ready to cook?','xh-ZA'],af:['Afrikaans','Haai! Sharp, ready to cook?','af-ZA'],st:['Sesotho','Dumela! Sharp, ready to cook?','st-ZA'],tn:['Setswana','Dumela! Sharp, ready to cook?','tn-ZA'],nso:['Sepedi','Dumela! Sharp, ready to cook?','nso-ZA'],ts:['Xitsonga','Avuxeni! Sharp, ready to cook?','ts-ZA'],ve:['Tshivenda','Ndaa! Sharp, ready to cook?','ts-ZA'],ss:['SiSwati','Sawubona! Sharp, ready to cook?','ss-ZA'],nr:['IsiNdebele','Lotjhani! Sharp, ready to cook?','nr-ZA']};

var SUBJ=['Mathematics','Mathematical Literacy','Physical Sciences','Life Sciences','Natural Sciences','Technology','English','Afrikaans','isiZulu','isiXhosa','Geography','History','Accounting','Business Studies','Economics','Agricultural Sciences','Tourism','CAT','IT','Life Orientation','EGD'];
var QZ=[['Force equals…','mass × acceleration','mass ÷ speed','speed × time',0],['Plants release…','oxygen','methane','helium',0],['Hypotenuse is opposite the…','right angle','smallest angle','base',0],['10% of 250 is…','25','2.5','52',0],['Assets = Equity + …','Liabilities','Sales','Tax',0],['Percent means out of…','100','10','1000',0],['Unit of force is the…','newton','joule','watt',0],['Where does photosynthesis happen?','chloroplast','nucleus','ribosome',0]];

var cur=null,step=0,lastBot='',lastUser='',clicks=0,chatHistory=[];
function ago(){return new Date().toDateString()}
function save(){sv('kasi',S);$('#pts').textContent=S.pts+' pts';$('#str').textContent=S.streak+' day streak';var b=$('#badges');b.textContent=S.badges.length?S.badges.join('  |  '):'None yet. Ask a question to earn your first.'}
function badge(n){if(S.badges.indexOf(n)<0){S.badges.push(n);msg('k','New badge: '+n+'! Eish, you’re on fire.')}}
function add(n){S.pts+=n;if(S.pts>=50)badge('50 Points Club');save()}
(function streak(){var t=ago();if(S.last!==t){var y=new Date(Date.now()-864e5).toDateString();S.streak=S.last===y?S.streak+1:1;S.last=t;if(S.streak>=3)S.badges.indexOf('3 Day Streak')<0&&S.badges.push('3 Day Streak')}})();

function msg(w,t,ref){var d=document.createElement('div');d.className='m '+w;d.textContent=t;if(ref){var r=document.createElement('div');r.className='ref';r.textContent=ref;d.appendChild(r)}$('#msgs').appendChild(d);d.scrollIntoView({block:'end'});if(w==='k')lastBot=t+(ref?' '+ref:'');return d}

// Async function to talk to your Render Backend API correctly!
async function ask(t, isLuffy=false){
    t=t.trim();if(!t)return;lastUser=t;msg('u',t);
    
    try {
        const response = await fetch(BACKEND_URL + '/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                message: t,
                mode: isLuffy ? 'luffy' : 'normal',
                lang: S.lang,
                history: chatHistory
            })
        });
        
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'AI unavailable');
        
        // Push to local conversation history for context memory
        chatHistory.push({ role: 'user', text: t });
        chatHistory.push({ role: 'model', text: data.reply });
        if(chatHistory.length > 12) chatHistory = chatHistory.slice(-12);

        msg('k', data.reply);
        add(5);
        badge('First Question');
    } catch (err) {
        msg('k', 'Eish, network error or the server is waking up from its nap. Try again in a second, fam!');
    }
}

function go(n){document.querySelectorAll('.tab').forEach(function(x){x.classList.toggle('on',x.id==='t-'+n)});document.querySelectorAll('nav button').forEach(function(b){b.classList.toggle('on',b.dataset.go===n)});$('#inbar').style.display=n==='chat'?'flex':'none'}
document.querySelectorAll('[data-go]').forEach(function(b){b.addEventListener('click',function(){go(b.dataset.go);if(b.dataset.listen)speak('Listen mode is on. Ask a question, then press Play and I’ll read the answer.')})});

$('#send').onclick=function(){ask($('#q').value);$('#q').value=''};
$('#q').addEventListener('keydown',function(e){if(e.key==='Enter'){$('#send').click()}});
$('#next').onclick=function(){ask('next hint')};

// Luffy Mode triggers the backend with mode: 'luffy'
$('#luffy').onclick=function(){
    if(!lastUser){
        msg('k','Ask me a question first, captain, then press Luffy!');
        return;
    }
    ask(lastUser, true);
};

$('#logo').onclick=function(){clicks++;if(clicks>=5){$('#luffy').style.display='inline-block';clicks=0}};

var u=null;function speak(t){if(!('speechSynthesis' in window))return;speechSynthesis.cancel();u=new SpeechSynthesisUtterance(t);u.rate=+$('#rate').value;u.lang=LANGS[S.lang][2];speechSynthesis.speak(u)}
$('#play').onclick=function(){if(speechSynthesis.paused){speechSynthesis.resume()}else speak(lastBot||'Ask me something first.')};
$('#pause').onclick=function(){if('speechSynthesis' in window)speechSynthesis.pause()};
$('#replay').onclick=function(){speak(lastBot)};
$('#rate').oninput=function(){$('#rv').textContent=this.value+'x'};

// Vision API integration for homework camera
$('#file').onchange=function(){
    var f=this.files[0];if(!f)return;var r=new FileReader();
    r.onload=async function(){
        var p=$('#prev');p.src=r.result;p.hidden=false;$('#camout').innerHTML='Analyzing homework image, hang tight...';
        var base64Data = r.result.split(',')[1];
        
        try {
            var res = await fetch(BACKEND_URL + '/api/vision', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ image: base64Data, mime: f.type, lang: S.lang })
            });
            var data = await res.json();
            if(!res.ok) throw new Error(data.error);
            
            $('#camout').innerHTML = '';
            msg('k', data.reply);
            add(2);
        } catch(e) {
            $('#camout').innerHTML='Eish, couldn’t read the image right now. Type the question in the chat instead!';
        }
    };
    r.readAsDataURL(f);
};

var sl=$('#lang');Object.keys(LANGS).forEach(function(k){var o=document.createElement('option');o.value=k;o.textContent=LANGS[k][0];sl.appendChild(o)});sl.value=S.lang;
sl.onchange=function(){S.lang=sl.value;$('#greet').textContent=LANGS[S.lang][1];save()};$('#greet').textContent=LANGS[S.lang][1];

SUBJ.forEach(function(s){var b=document.createElement('button');b.className='pill';b.textContent=s;b.onclick=function(){go('chat');ask('Help me with '+s+'. Where do I start?')};$('#subs').appendChild(b)});

// Library items trigger chat queries to your backend
KB.forEach(function(e){var d=document.createElement('div');d.className='card';var h=document.createElement('b');h.textContent=e.t+' ('+e.s+')';var p=document.createElement('div');p.textContent=e.c;var b=document.createElement('button');b.className='btn alt';b.style.marginTop='8px';b.textContent='Work through it';b.onclick=function(){go('chat');ask('Explain '+e.t+' ('+e.s+')')};d.appendChild(h);d.appendChild(p);d.appendChild(b);$('#lib').appendChild(d)});

var qi=0,qs=[],qsc=0;(function(){var d=Math.floor(Date.now()/864e5);for(var i=0;i<5;i++)qs.push(QZ[(d+i)%QZ.length]);showQ()})();
function showQ(){var z=$('#quiz');z.innerHTML='';if(qi>=qs.length){z.textContent='Done! You got '+qsc+' out of 5. Come back tomorrow for a new quiz.';if(qsc>=4)badge('Quiz Champ');return}
var q=qs[qi],p=document.createElement('div');p.textContent=(qi+1)+'/5  '+q[0];z.appendChild(p);
[1,2,3].map(function(i){return{t:q[i],c:i===1}}).sort(function(){return Math.random()-.5}).forEach(function(o){var b=document.createElement('button');b.className='pill opt';b.textContent=o.t;b.onclick=function(){if(b.dataset.d)return;z.querySelectorAll('.opt').forEach(function(x){x.dataset.d=1});b.classList.add(o.c?'ok':'no');if(o.c){qsc++;add(10)}setTimeout(function(){qi++;showQ()},900)};z.appendChild(b)})}

var ex=$('#exam');ex.value=S.exam||'';function exOut(){if(!ex.value){$('#examout').textContent='';return}var d=Math.ceil((new Date(ex.value)-new Date(ago()))/864e5);$('#examout').textContent=d>0?d+' days to go. Study a little every day and you’ll be sharp.':(d===0?'Exam day! You’ve got this.':'That date has passed. Pick your next exam.')}
ex.onchange=function(){S.exam=ex.value;save();exOut()};exOut();

msg('k','Sharp, fam! Ready to cook? I’m Kasi, your learning buddy. Let’s work it out together!');
save();
})();
</script>
